apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: production-app
  template:
    metadata:
      labels:
        app: production-app
    spec:
      containers:
      - name: production-container
        image: us-central1-docker.pkg.dev/qwiklabs-gcp-02-711b3921f15f/my-repository/hello-cloudbuild:v2.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            # Guaranteed minimum resources
            cpu: "250m"
            memory: "64Mi"
          limits:
            # Maximum allowed resources
            cpu: "250m"
            memory: "128Mi"
---
kind: Service
apiVersion: v1
metadata:
  name: service-production-app
  namespace: prod
spec:
  selector:
    app: production-app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
  type: LoadBalancer        
